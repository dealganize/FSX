# Local Postgres for FSX. One container, nothing else.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fsx
      POSTGRES_PASSWORD: fsx
      POSTGRES_DB: fsx
    ports:
      - "5432:5432"
    volumes:
      - fsx-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsx"]
      interval: 5s
      retries: 10
volumes:
  fsx-pg:
