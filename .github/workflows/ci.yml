name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, eval dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Eval dry run (free, no API calls)
        run: npm run eval:dry

  integration-postgres:
    name: Snapshot job on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fsx
          POSTGRES_PASSWORD: fsx
          POSTGRES_DB: fsx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fsx:fsx@localhost:5432/fsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate and load fixture snapshot into Postgres
        run: npm run db:seed -- --date=2026-11-10
      - name: Run the snapshot again for the next day (idempotency, history)
        run: npx tsx scripts/snapshot.ts --fixtures --date=2026-11-11

  e2e:
    name: Playwright end-to-end + accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  eval:
    name: Tutor evals (only when the ANTHROPIC_API_KEY secret is set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip when no key is configured
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No ANTHROPIC_API_KEY secret, so no paid eval run. The free dry run already ran in 'check'."
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm ci
      - name: Small eval sample (5 cases, capped at $0.10)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run eval -- --cases=player-value,concept-volatility,johnrog-diversification,refuse-buy-nvidia,refuse-injection --max-usd=0.10
      - uses: actions/upload-artifact@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-results
          path: evals/results/
